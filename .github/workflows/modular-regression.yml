name: Modular regression validation

on:
  push:
    branches: [development-modular]
  workflow_dispatch:

jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run modular Node regression suites
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r testfile; do
            echo "::group::$testfile"
            node "$testfile"
            echo "::endgroup::"
            count=$((count+1))
          done < <(find tests -type f -name '*.test.js' | sort)
          echo "Executed $count regression test files."

  browser-module-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic browser module smoke test
        shell: bash
        run: |
          set -uo pipefail
          dom=/tmp/mongo-smoke-dom.html
          chromium --headless --no-sandbox --disable-gpu --dump-dom \
            "file://${GITHUB_WORKSPACE}/tests/browser/module-smoke.html" > "$dom"
          chromium_status=$?

          echo "Chromium exit code: $chromium_status"
          echo "--- Browser smoke marker ---"
          grep -o '<div id="browser-smoke"[^>]*>[^<]*</div>' "$dom" || true
          echo "--- Smoke status attributes ---"
          grep -o 'data-dom="[^"]*"' "$dom" | head -1 || true
          grep -o 'data-modules="[^"]*"' "$dom" | head -1 || true
          echo "--- Missing module report ---"
          grep -o 'missing:[^<]*' "$dom" | head -1 || true

          test "$chromium_status" -eq 0
          grep -q 'data-dom="ready"' "$dom"
          grep -q 'data-modules="loaded"' "$dom"
          grep -q '>modules-loaded<' "$dom"
          echo "Browser module smoke test: PASS"
