name: Wire MongoCloud once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/fix/safe-delete-all-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-delete-all-data
          fetch-depth: 0

      - name: Patch index safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="src/services/cloud/cloud.js"></script>'

          if tag in s:
              raise SystemExit('MongoCloud script is already wired; refusing duplicate insertion.')

          # Production runtime is monolithic. Insert immediately before the first
          # script element so MongoCloud exists before any app runtime can call it.
          m = re.search(r'<script\b', s, flags=re.I)
          if not m:
              raise SystemExit('No <script> anchor found; refusing to modify index.html.')

          out = s[:m.start()] + tag + '\n' + s[m.start():]
          if out.count(tag) != 1:
              raise SystemExit('Expected exactly one MongoCloud tag after patch.')

          p.write_text(out, encoding='utf-8')

      - name: Verify one-line wiring only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "index.html"
          test "$(grep -Fxc '<script src="src/services/cloud/cloud.js"></script>' index.html)" -eq 1
          git diff --check
          git diff --numstat
          git diff -- index.html | head -80
          ADDED=$(git diff --numstat -- index.html | awk '{print $1}')
          REMOVED=$(git diff --numstat -- index.html | awk '{print $2}')
          test "$ADDED" -eq 1
          test "$REMOVED" -eq 0

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load MongoCloud before production runtime"
          git push origin HEAD:fix/safe-delete-all-data
