name: Wire Cloud diagnostic once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/fix/safe-delete-all-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-delete-all-data
          fetch-depth: 0

      - name: Patch diagnostic script safely
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cloud = '<script src="src/services/cloud/cloud.js"></script>'
          diag = '<script src="src/services/cloud/cloud-write-diagnostic.js"></script>'

          if s.count(cloud) != 1:
              raise SystemExit('Expected exactly one MongoCloud script; refusing patch.')
          if diag in s:
              raise SystemExit('Diagnostic script already wired; refusing duplicate insertion.')

          out = s.replace(cloud, cloud + '\n' + diag, 1)
          if out.count(diag) != 1:
              raise SystemExit('Expected exactly one diagnostic script after patch.')
          p.write_text(out, encoding='utf-8')

      - name: Verify one-line diagnostic wiring only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "index.html"
          test "$(grep -Fxc '<script src="src/services/cloud/cloud.js"></script>' index.html)" -eq 1
          test "$(grep -Fxc '<script src="src/services/cloud/cloud-write-diagnostic.js"></script>' index.html)" -eq 1
          git diff --check
          git diff --numstat
          ADDED=$(git diff --numstat -- index.html | awk '{print $1}')
          REMOVED=$(git diff --numstat -- index.html | awk '{print $2}')
          test "$ADDED" -eq 1
          test "$REMOVED" -eq 0
          git diff -- index.html | head -80

      - name: Commit diagnostic wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire read-only Cloud diagnostic"
          git push origin HEAD:fix/safe-delete-all-data
