name: One-shot V38.2h patch
on:
  push:
    branches: [feature/completed-cards-archive]
    paths: ['.github/workflows/patch-v382h.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/completed-cards-archive
      - name: Patch V38.2g early-cancel UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'id="v382h-i18n-format"' in s:
              raise SystemExit('V38.2h already present')
          marker='\n</body>'
          if marker not in s: raise SystemExit('body marker missing')
          patch=r'''
<script id="v382h-i18n-format">
(function(){
const T={
mn:{save:'Хуримтлал тооцох',early:'Хугацаанаас өмнө цуцлах',p:'Үндсэн мөнгө',cr:'Гэрээний жилийн хүү (%)',rr:'Цуцлалтын жилийн хүү (%)',prior:'Өмнө бодитоор олгосон хүү',start:'Хадгаламж эхэлсэн огноо',end:'Цуцлах огноо',days:'Хадгалсан хугацаа',day:'хоног',dateErr:'Огноогоо шалгана уу',fee:'Цуцлалтын шимтгэл',rule:'Цуцлалтын дүрэм',all:'Бүх хадгалсан хугацааг цуцлалтын хүүгээр дахин бодох',vested:'Бүтэн жилүүдийг гэрээний хүүгээр, үлдсэн хугацааг цуцлалтын хүүгээр бодох',manual:'Банкны нөхцөлөөр / эцсийн хүүг гараар оруулах',manualAmt:'Банкны зөвшөөрсөн эцсийн хүү',go:'Тооцоолох',principal:'Үндсэн мөнгө',allowed:'Цуцлалтаар зөвшөөрөгдөх хүү',claw:'Өмнөх хүүгийн буцаан тохируулга',add:'Нэмж олгох хүү',feeOut:'Шимтгэл',total:'Банкнаас авах тооцоолсон дүн',note:'Урьдчилсан тооцоо. Бодит данс, гүйлгээ, төсөвт өөрчлөлт хийхгүй.'},
en:{save:'Savings calculator',early:'Early withdrawal',p:'Principal',cr:'Contract annual interest (%)',rr:'Early-withdrawal annual interest (%)',prior:'Interest already paid',start:'Deposit start date',end:'Withdrawal date',days:'Time saved',day:'days',dateErr:'Check the dates',fee:'Early-withdrawal fee',rule:'Withdrawal rule',all:'Recalculate the full saved period at the early-withdrawal rate',vested:'Use contract rate for full years and early-withdrawal rate for the remaining period',manual:'Bank terms / enter final interest manually',manualAmt:'Final interest approved by bank',go:'Calculate',principal:'Principal',allowed:'Interest allowed on withdrawal',claw:'Adjustment of previously paid interest',add:'Additional interest',feeOut:'Fee',total:'Estimated amount received from bank',note:'Estimate only. Does not change actual accounts, transactions, or budget.'},
zh:{save:'储蓄计算',early:'提前支取',p:'本金',cr:'合同年利率 (%)',rr:'提前支取年利率 (%)',prior:'已实际支付的利息',start:'存款开始日期',end:'支取日期',days:'存款期限',day:'天',dateErr:'请检查日期',fee:'提前支取手续费',rule:'提前支取规则',all:'全部存款期间按提前支取利率重新计算',vested:'整年按合同利率，其余期间按提前支取利率计算',manual:'按银行条件 / 手动输入最终利息',manualAmt:'银行确认的最终利息',go:'计算',principal:'本金',allowed:'提前支取可得利息',claw:'已付利息调整',add:'追加利息',feeOut:'手续费',total:'预计从银行收到的金额',note:'仅供估算，不会更改实际账户、交易或预算。'},
ja:{save:'貯蓄計算',early:'中途解約',p:'元金',cr:'契約年利率 (%)',rr:'中途解約年利率 (%)',prior:'すでに支払われた利息',start:'預金開始日',end:'解約日',days:'預入期間',day:'日',dateErr:'日付を確認してください',fee:'中途解約手数料',rule:'解約ルール',all:'全預入期間を中途解約利率で再計算',vested:'満年は契約利率、残り期間は中途解約利率で計算',manual:'銀行条件 / 最終利息を手入力',manualAmt:'銀行が認めた最終利息',go:'計算',principal:'元金',allowed:'解約時に認められる利息',claw:'支払済み利息の調整',add:'追加利息',feeOut:'手数料',total:'銀行から受け取る推定額',note:'概算です。実際の口座、取引、予算は変更しません。'},
ko:{save:'저축 계산',early:'중도 해지',p:'원금',cr:'약정 연이율 (%)',rr:'중도 해지 연이율 (%)',prior:'이미 지급된 이자',start:'예금 시작일',end:'해지일',days:'예치 기간',day:'일',dateErr:'날짜를 확인하세요',fee:'중도 해지 수수료',rule:'해지 규칙',all:'전체 예치 기간을 중도 해지 이율로 재계산',vested:'완전한 연도는 약정 이율, 남은 기간은 중도 해지 이율 적용',manual:'은행 조건 / 최종 이자 직접 입력',manualAmt:'은행이 승인한 최종 이자',go:'계산',principal:'원금',allowed:'해지 시 인정 이자',claw:'기지급 이자 조정',add:'추가 이자',feeOut:'수수료',total:'은행에서 받을 예상 금액',note:'예상 계산입니다. 실제 계좌, 거래, 예산은 변경하지 않습니다.'},
ru:{save:'Расчёт накоплений',early:'Досрочное расторжение',p:'Основная сумма',cr:'Годовая ставка по договору (%)',rr:'Годовая ставка при досрочном расторжении (%)',prior:'Уже выплаченные проценты',start:'Дата начала вклада',end:'Дата расторжения',days:'Срок хранения',day:'дн.',dateErr:'Проверьте даты',fee:'Комиссия за досрочное расторжение',rule:'Правило расторжения',all:'Пересчитать весь срок по ставке досрочного расторжения',vested:'Полные годы — по договорной ставке, остаток — по ставке досрочного расторжения',manual:'По условиям банка / ввести итоговые проценты вручную',manualAmt:'Итоговые проценты, подтверждённые банком',go:'Рассчитать',principal:'Основная сумма',allowed:'Допустимые проценты при расторжении',claw:'Корректировка ранее выплаченных процентов',add:'Дополнительные проценты',feeOut:'Комиссия',total:'Расчётная сумма к получению из банка',note:'Предварительный расчёт. Реальные счета, операции и бюджет не изменяются.'},
