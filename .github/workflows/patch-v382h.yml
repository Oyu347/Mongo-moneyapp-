name: One-shot V38.2h patch
on:
  push:
    branches: [feature/completed-cards-archive]
    paths: ['.github/workflows/patch-v382h.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/completed-cards-archive
      - name: Apply prepared patch
        shell: bash
        run: |
          echo 'Prepared patch workflow is intentionally disabled after staging; use the staged V38.2h payload from prior commit if manual recovery is needed.'
          exit 1
