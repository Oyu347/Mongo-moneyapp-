};
const CUR={mn:'₮',en:'$',zh:'¥',ja:'¥',ko:'₩',ru:'₽',de:'€'};
function code(){const vals=[document.querySelector('#lang')?.value,document.querySelector('#language')?.value,document.documentElement.lang,window.currentLang,window.lang,localStorage.getItem('lang'),localStorage.getItem('language')].filter(Boolean).map(v=>String(v).toLowerCase());for(const v of vals){if(v.startsWith('mn'))return'mn';if(v.startsWith('en'))return'en';if(v.startsWith('zh')||v==='cn')return'zh';if(v.startsWith('ja')||v==='jp')return'ja';if(v.startsWith('ko')||v==='kr')return'ko';if(v.startsWith('ru'))return'ru';if(v.startsWith('de'))return'de'}const f=(document.querySelector('[id*="lang"]')?.textContent||'');return f.includes('🇯🇵')?'ja':f.includes('🇰🇷')?'ko':f.includes('🇨🇳')?'zh':f.includes('🇷🇺')?'ru':f.includes('🇩🇪')?'de':f.includes('🇬🇧')||f.includes('🇺🇸')?'en':'mn'}
function lab(id,text){const e=document.getElementById(id);const l=e?.previousElementSibling;if(l&&l.tagName==='LABEL')l.textContent=text}
function moneyRaw(v){return String(v||'').replace(/[^0-9.-]/g,'')}
function moneyFmt(v){const raw=moneyRaw(v);if(!raw)return'';const a=raw.split('.');a[0]=a[0].replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,',');return a.slice(0,2).join('.')}
function localizeResult(t,c){const rows=document.querySelectorAll('#gout .grow');const keys=['principal','allowed','claw','add','feeOut','total'];rows.forEach((r,i)=>{if(!keys[i])return;const s=r.querySelector('span'),b=r.querySelector('strong');if(s)s.textContent=t[keys[i]];if(b)b.textContent=b.textContent.replace(/[₮$¥₩₽€]/g,c)});const n=document.querySelector('#v382gCancel .gnote');if(n)n.textContent=t.note}
function apply(){const l=code(),t=T[l]||T.mn,c=CUR[l]||'₮';const save=document.getElementById('v382dSave'),early=document.getElementById('v382dEarly');if(save)save.textContent=t.save;if(early)early.textContent=t.early;lab('gp',t.p);lab('gcr',t.cr);lab('grr',t.rr);lab('gprior',t.prior);lab('gstart',t.start);lab('gend',t.end);lab('gdays',t.days);lab('gfee',t.fee);lab('grule',t.rule);lab('gmanual',t.manualAmt);const r=document.getElementById('grule');if(r&&r.options.length>=3){r.options[0].text=t.all;r.options[1].text=t.vested;r.options[2].text=t.manual}const go=document.getElementById('v382gGo');if(go)go.textContent=t.go;const d=document.getElementById('gdays');if(d&&d.textContent!=='— хоног'&&d.textContent!=='— '+t.day){const m=d.textContent.match(/\d+/);if(m)d.textContent=m[0]+' '+t.day}const n=document.querySelector('#v382gCancel .gnote');if(n)n.textContent=t.note;localizeResult(t,c)}
function wire(){const box=document.getElementById('v382gCancel');if(!box)return;['gp','gprior','gfee','gmanual'].forEach(id=>{const e=document.getElementById(id);if(!e||e.dataset.v382h)return;e.dataset.v382h='1';e.type='text';e.inputMode='decimal';e.addEventListener('input',()=>{const pos=e.selectionStart;const old=e.value;e.value=moneyFmt(e.value);try{const delta=e.value.length-old.length;e.setSelectionRange(Math.max(0,pos+delta),Math.max(0,pos+delta))}catch(_){}})});const go=document.getElementById('v382gGo');if(go&&!go.dataset.v382h){go.dataset.v382h='1';go.addEventListener('click',()=>{['gp','gprior','gfee','gmanual'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=moneyRaw(e.value)});setTimeout(()=>{['gp','gprior','gfee','gmanual'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=moneyFmt(e.value)});apply()},0)},true)}['gstart','gend'].forEach(id=>{const e=document.getElementById(id);if(e&&!e.dataset.v382hdate){e.dataset.v382hdate='1';e.addEventListener('change',()=>setTimeout(apply,0))}});apply()}
let last='';setInterval(()=>{wire();const c=code();if(c!==last){last=c;apply()}},300);document.addEventListener('click',()=>setTimeout(()=>{wire();apply()},80));
})();
</script>
'''
          s=s.replace(marker,patch+marker,1)
          p.write_text(s,encoding='utf-8')
          with Path('docs/modularization/PROGRESS.md').open('a',encoding='utf-8') as f:
              f.write('\n\n## V38.2h — 2026-09-12 — NEEDS PHONE TEST\n- Scope: early-cancellation calculator only.\n- Added 7-language labels/options/results using the established locale detection pattern.\n- Added live thousands separators to money-entry fields only; percentages and dates remain unformatted.\n- Preserved V38.2g calculation formulas; formatting is stripped before calculation and restored after.\n- Next: phone-test all 7 languages, comma entry, and one known calculation case.\n')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Möngö Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html docs/modularization/PROGRESS.md
          git commit -m 'V38.2h: localize early cancellation and format money inputs'
          git push origin HEAD:feature/completed-cards-archive
